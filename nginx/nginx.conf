events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name rov-management.thanhminhle.id.vn localhost;
        return 301 https://$host$request_uri;
    }

    # Cấu hình HTTPS
    server {
        listen 443 ssl;
        server_name rov-management.thanhminhle.id.vn localhost;

        ssl_certificate /etc/letsencrypt/live/rov-management.thanhminhle.id.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rov-management.thanhminhle.id.vn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Điều hướng request API tới backend container
        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Cấu hình cho Server-Sent Events (SSE)
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Phục vụ Frontend React (SPA Router Fallback)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
