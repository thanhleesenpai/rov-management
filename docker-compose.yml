version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: rov_redis
    # Không expose port ra host — chỉ backend truy cập qua docker network nội bộ (redis://redis:6379)
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rov_backend
    env_file: ./backend/.env
    environment:
      # Ghi đè các biến môi trường để dùng internal network trong Docker
      - REDIS_URL=redis://redis:6379
      - YOLO_SERVICE_URL=http://yolo:8000
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  yolo:
    build: ./yolo-service
    container_name: rov_yolo
    # Không expose port ra host — service không có auth, chỉ backend gọi qua docker network nội bộ (http://yolo:8000)
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: rov_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
